<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar Chart Animation — Section A Test</title>
  <style>
    body {
      font-family: Inter, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #1f1f1f; margin-bottom: 10px; }
    .subtitle { color: #777; margin-bottom: 30px; }
    .test-container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .test-header {
      font-size: 14px;
      font-weight: 600;
      color: #5422b0;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .canvas-pair {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .canvas-wrapper {
      flex: 1;
      min-width: 300px;
    }
    .canvas-label {
      font-size: 12px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    canvas {
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      width: 100%;
      height: auto;
      max-width: 540px;
    }
    .metrics {
      background: #f9f9f9;
      border-left: 4px solid #5422b0;
      padding: 12px;
      margin-top: 15px;
      font-family: monospace;
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }
    .error {
      background: #fee;
      border-left-color: #f44;
      color: #c00;
    }
    .success {
      background: #efe;
      border-left-color: #4f4;
      color: #040;
    }
    .log-output {
      background: #1f1f1f;
      color: #0f0;
      padding: 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      max-height: 300px;
      overflow-y: auto;
      margin-top: 20px;
    }
    .log-line { margin: 2px 0; }
    button {
      background: #5422b0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      margin-top: 20px;
    }
    button:hover { background: #3d1a7f; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Bar Chart Animation — Section A Testing</h1>
  <p class="subtitle">
    Verify that Chart.js chartArea populates correctly, hidden-data renders grey,
    and all bar variants (vertical, horizontal, stacked) work reliably.
  </p>

  <div id="tests-container"></div>
  <button id="run-all-btn">Run All Tests</button>
  <div id="log-output" class="log-output"></div>

  <script type="module">
    // This test page must run after building with `npm run build`
    // and copying the dist files. For now, it logs instructions.

    const logOutput = document.getElementById('log-output');
    const testContainer = document.getElementById('tests-container');
    const logs = [];

    function log(msg, type = 'log') {
      console.log(msg);
      logs.push(msg);
      const line = document.createElement('div');
      line.className = 'log-line';
      line.textContent = msg;
      logOutput.appendChild(line);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    function createTestHTML(testName, verticalCanvas, hiddenCanvas, metrics, error) {
      const container = document.createElement('div');
      container.className = 'test-container';

      const header = document.createElement('div');
      header.className = 'test-header';
      header.textContent = testName;
      container.appendChild(header);

      if (error) {
        const errorBox = document.createElement('div');
        errorBox.className = 'metrics error';
        errorBox.textContent = `❌ Error: ${error}`;
        container.appendChild(errorBox);
      } else {
        const pair = document.createElement('div');
        pair.className = 'canvas-pair';

        const normalWrapper = document.createElement('div');
        normalWrapper.className = 'canvas-wrapper';
        const normalLabel = document.createElement('div');
        normalLabel.className = 'canvas-label';
        normalLabel.textContent = 'Normal (Full Color)';
        normalWrapper.appendChild(normalLabel);
        normalWrapper.appendChild(verticalCanvas);

        const hiddenWrapper = document.createElement('div');
        hiddenWrapper.className = 'canvas-wrapper';
        const hiddenLabel = document.createElement('div');
        hiddenLabel.className = 'canvas-label';
        hiddenLabel.textContent = 'Hidden (Greyed Base)';
        hiddenWrapper.appendChild(hiddenLabel);
        hiddenWrapper.appendChild(hiddenCanvas);

        pair.appendChild(normalWrapper);
        pair.appendChild(hiddenWrapper);
        container.appendChild(pair);

        const metricsBox = document.createElement('div');
        metricsBox.className = 'metrics success';
        metricsBox.innerHTML = metrics;
        container.appendChild(metricsBox);
      }

      testContainer.appendChild(container);
    }

    async function runTests() {
      log('='.repeat(60));
      log('Section A Testing: Bar Chart Two-Render Strategy');
      log('='.repeat(60));

      // Note: This test requires the compiled dist/ code to be loaded
      // Since we're in development, this page serves as a placeholder
      // for integration with the actual bar-chart-setup.ts module

      log('');
      log('⚠️  Test Instructions:');
      log('1. Build the project: npm run build');
      log('2. Import { createHiddenDataRender, testBarChartRender } from bar-chart-setup.ts');
      log('3. Call testBarChartRender() with a BarClipConfig for each variant:');
      log('   - Vertical bars (barOrientation: "vertical")');
      log('   - Horizontal bars (barOrientation: "horizontal")');
      log('   - Stacked bars (barMode: "stacked")');
      log('');
      log('Expected Results:');
      log('  ✓ chart.chartArea should be defined with non-zero width/height');
      log('  ✓ Normal canvas shows full-color bars, axes, legend');
      log('  ✓ Hidden canvas shows grey/muted bars, axes, legend');
      log('  ✓ All three variants render without exceptions');
      log('');
      log('='.repeat(60));

      // Create placeholder test containers
      ['Vertical Bars', 'Horizontal Bars', 'Stacked Bars'].forEach((name) => {
        const msg = `${name}: Awaiting manual test via testBarChartRender()`;
        log(msg);
        createTestHTML(name, null, null, msg, null);
      });

      log('');
      log('Once you run the tests and see no errors in the console,');
      log('Section A is ready to proceed to Section B (wipe math).');
      log('');
    }

    document.getElementById('run-all-btn').addEventListener('click', () => {
      logs.length = 0;
      logOutput.innerHTML = '';
      testContainer.innerHTML = '';
      runTests();
    });

    // Auto-run on page load
    window.addEventListener('load', runTests);
  </script>
</body>
</html>
