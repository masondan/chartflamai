<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#5422b0" />
		<meta name="description" content="Mobile-first chart generator with AI" />

		<!-- Open Graph -->
		<meta property="og:title" content="ChartFlam" />
		<meta property="og:description" content="Create charts and discover stories in data." />
		<meta property="og:image" content="https://chartflam.flamtools.com/logos/logo-chartflam-og.png" />
		<meta property="og:type" content="website" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="ChartFlam" />
		<meta name="twitter:description" content="Mobile-first chart generator with AI" />
		<meta name="twitter:image" content="https://chartflam.flamtools.com/logos/logo-chartflam-og.png" />

		<!-- Robots: strict noindex/nofollow during development -->
		<meta name="robots" content="noindex, nofollow" />

		<!-- PWA -->
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/logos/logo-chartflam-favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/logos/logo-chartflam-favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="/logos/logo-chartflam-touch.png" />
	
		<!-- Suppress PWA install prompt -->
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
	
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script src="%sveltekit.assets%/flam-nav.js" defer></script>
		<script>
			// Suppress PWA install prompt
			window.addEventListener('beforeinstallprompt', (e) => {
				e.preventDefault();
			});
		</script>
		</body>
</html>
